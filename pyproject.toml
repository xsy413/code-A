[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-coding-agent"
version = "0.1.0"
description = "A local coding agent built with LangGraph, restricted tools, and SQLite audit logs."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "typer>=0.12.0",
]

[project.scripts]
agent = "app.cli:app"

[tool.setuptools]
packages = ["app", "app.graph", "app.graph.nodes", "app.llm", "app.tools", "app.sandbox", "app.store", "app.prompts"]
